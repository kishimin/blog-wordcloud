[project]
name = "blog-wordcloud-analysis"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "SudachiDict-core==20260723.1",
    "SudachiPy==0.7.0",
    "python-dotenv==0.21.0",
    "requests==2.34.2",
    "wordcloud==1.9.6",
]

[dependency-groups]
dev = [
    "black==24.4.2",
    "pytest==7.4.4",
    "pytest-cov==7.0.0",
]

[tool.uv]
package = false

[tool.black]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["."]

[tool.coverage.run]
source = ["."]
omit = ["test_*.py"]

[tool.coverage.report]
fail_under = 80
