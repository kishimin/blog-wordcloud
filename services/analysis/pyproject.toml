[build-system]
requires = ["hatchling>=1,<2"]
build-backend = "hatchling.build"

[project]
name = "kotogumo-analysis"
version = "0.1.0"
description = "Morphological analysis and word cloud image generation service for Kotogumo."
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.100,<1",
    "uvicorn[standard]>=0.30,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "small: Tests that use one process without network, database, or filesystem access.",
    "medium: Tests that may use localhost, a database, or the filesystem.",
    "large: Tests that may use external systems or remote network access.",
]

[tool.coverage.run]
branch = true
source = ["src/analysis"]

[tool.coverage.report]
# Default so a bare local `pytest --cov` still enforces a floor. CI's
# --cov-fail-under CLI flag always overrides this per event (see ci.yml):
# 80 on pull_request, 0 on push/nightly, whose narrower or differently
# scoped ADR-0043 test set must not fail the build over code a different
# test size is meant to cover.
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1,<2",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.14,<1",
]
