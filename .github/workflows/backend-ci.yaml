name: Backend CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install workspace dependencies
        id: install
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun run --cwd backend typecheck
      - name: Check workflow YAML formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run format:yaml:check
      - name: ESLint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run --cwd backend lint
      - name: Check formatting, lint, and shared configuration
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bunx biome check backend types package.json tsconfig.json tsconfig.base.json biome.json eslint.config.base.mjs

  test:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Run tests with coverage
        run: bun run --cwd backend test:coverage --coverage-reporter=text --coverage-reporter=lcov
      - name: Upload coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: app/backend/coverage/
          if-no-files-found: warn
